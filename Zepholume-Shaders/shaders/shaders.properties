# Zepholume 1.0.3-dev. No Iris-exclusive required feature flags.
# Profiles establish coherent baselines. The listed controls are bounded
# per-feature overrides; ZEPH_PROFILE_TIER is intentionally profile-only.
screen = <profile> <empty> [Lighting] [Sky_Atmosphere] [Clouds] [Water] [Weather] [Performance]
screen.Lighting = ZEPH_EXPOSURE ZEPH_CONTRAST ZEPH_SATURATION ZEPH_COLOUR_TEMPERATURE ZEPH_FACE_LIGHTING_QUALITY ZEPH_MATERIAL_QUALITY
screen.Sky_Atmosphere = ZEPH_FOG_QUALITY ZEPH_ATMOSPHERE_QUALITY
screen.Clouds = ZEPH_CLOUD_QUALITY ZEPH_CLOUD_TIER
screen.Water = ZEPH_WATER_QUALITY ZEPH_WATER_TIER
screen.Weather = ZEPH_WEATHER_QUALITY
screen.Performance = ZEPH_WATER_WAVES
profile.Potato = ZEPH_PROFILE_TIER:0 ZEPH_EXPOSURE:1 ZEPH_CONTRAST:1 ZEPH_SATURATION:1 ZEPH_COLOUR_TEMPERATURE:1 ZEPH_FOG_QUALITY:0 ZEPH_ATMOSPHERE_QUALITY:0 ZEPH_FACE_LIGHTING_QUALITY:0 ZEPH_MATERIAL_QUALITY:0 ZEPH_CLOUD_QUALITY:0 ZEPH_CLOUD_TIER:0 ZEPH_WATER_QUALITY:0 ZEPH_WATER_TIER:0 ZEPH_WATER_WAVES:0 ZEPH_WEATHER_QUALITY:0
profile.Low = ZEPH_PROFILE_TIER:1 ZEPH_EXPOSURE:1 ZEPH_CONTRAST:1 ZEPH_SATURATION:1 ZEPH_COLOUR_TEMPERATURE:1 ZEPH_FOG_QUALITY:1 ZEPH_ATMOSPHERE_QUALITY:1 ZEPH_FACE_LIGHTING_QUALITY:1 ZEPH_MATERIAL_QUALITY:0 ZEPH_CLOUD_QUALITY:1 ZEPH_CLOUD_TIER:1 ZEPH_WATER_QUALITY:1 ZEPH_WATER_TIER:1 ZEPH_WATER_WAVES:1 ZEPH_WEATHER_QUALITY:1
profile.Balanced = ZEPH_PROFILE_TIER:2 ZEPH_EXPOSURE:1 ZEPH_CONTRAST:1 ZEPH_SATURATION:1 ZEPH_COLOUR_TEMPERATURE:2 ZEPH_FOG_QUALITY:1 ZEPH_ATMOSPHERE_QUALITY:1 ZEPH_FACE_LIGHTING_QUALITY:2 ZEPH_MATERIAL_QUALITY:1 ZEPH_CLOUD_QUALITY:1 ZEPH_CLOUD_TIER:2 ZEPH_WATER_QUALITY:1 ZEPH_WATER_TIER:2 ZEPH_WATER_WAVES:1 ZEPH_WEATHER_QUALITY:1
profile.High = ZEPH_PROFILE_TIER:3 ZEPH_EXPOSURE:1 ZEPH_CONTRAST:2 ZEPH_SATURATION:1 ZEPH_COLOUR_TEMPERATURE:2 ZEPH_FOG_QUALITY:1 ZEPH_ATMOSPHERE_QUALITY:1 ZEPH_FACE_LIGHTING_QUALITY:3 ZEPH_MATERIAL_QUALITY:1 ZEPH_CLOUD_QUALITY:1 ZEPH_CLOUD_TIER:3 ZEPH_WATER_QUALITY:1 ZEPH_WATER_TIER:3 ZEPH_WATER_WAVES:1 ZEPH_WEATHER_QUALITY:2
profile.Ultra = ZEPH_PROFILE_TIER:4 ZEPH_EXPOSURE:1 ZEPH_CONTRAST:2 ZEPH_SATURATION:2 ZEPH_COLOUR_TEMPERATURE:2 ZEPH_FOG_QUALITY:1 ZEPH_ATMOSPHERE_QUALITY:1 ZEPH_FACE_LIGHTING_QUALITY:3 ZEPH_MATERIAL_QUALITY:1 ZEPH_CLOUD_QUALITY:1 ZEPH_CLOUD_TIER:4 ZEPH_WATER_QUALITY:1 ZEPH_WATER_TIER:4 ZEPH_WATER_WAVES:1 ZEPH_WEATHER_QUALITY:3
# Deprecated compatibility alias. It intentionally selects the Low baseline.
profile.Ultra_Lite = ZEPH_PROFILE_TIER:1 ZEPH_EXPOSURE:1 ZEPH_CONTRAST:1 ZEPH_SATURATION:1 ZEPH_COLOUR_TEMPERATURE:1 ZEPH_FOG_QUALITY:1 ZEPH_ATMOSPHERE_QUALITY:1 ZEPH_FACE_LIGHTING_QUALITY:1 ZEPH_MATERIAL_QUALITY:0 ZEPH_CLOUD_QUALITY:1 ZEPH_CLOUD_TIER:1 ZEPH_WATER_QUALITY:1 ZEPH_WATER_TIER:1 ZEPH_WATER_WAVES:1 ZEPH_WEATHER_QUALITY:1
