name: Zepholume Shaders CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POWERSHELL_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Enforce workflow security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import re
          import sys
          from pathlib import Path

          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          if not workflows:
              print("::error::.github/workflows contains no workflow files")
              raise SystemExit(1)

          errors = 0
          for workflow in workflows:
              text = workflow.read_text(encoding="utf-8")

              forbidden_trigger = "pull_request" + "_target:"
              if forbidden_trigger in text:
                  print(f"::error file={workflow}::Privileged pull-request target contexts are forbidden")
                  errors += 1

              if re.search(r"(?m)^\s*permissions:\s*write-all\s*$", text):
                  print(f"::error file={workflow}::write-all permissions are forbidden")
                  errors += 1

              for match in re.finditer(r"(?m)^\s+[A-Za-z0-9_-]+:\s+write\s*$", text):
                  line = text.count("\n", 0, match.start()) + 1
                  print(f"::error file={workflow},line={line}::CI permissions must remain read-only")
                  errors += 1

              for match in re.finditer(r"(?m)^\s*uses:\s*([^\s#]+)", text):
                  action = match.group(1)
                  if action.startswith("./"):
                      continue
                  if not re.fullmatch(r"[^/]+/[^@]+@[0-9a-f]{40}", action):
                      line = text.count("\n", 0, match.start()) + 1
                      print(f"::error file={workflow},line={line}::Action is not pinned to a 40-character commit SHA: {action}")
                      errors += 1

          raise SystemExit(1 if errors else 0)
          PY

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for attempt in 1 2 3; do
            if GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Failed to install actionlint after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint all workflows
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          if [[ "${#workflow_files[@]}" -eq 0 ]]; then
            echo "::error::No workflow files found"
            exit 1
          fi
          actionlint "${workflow_files[@]}"

  regression-tests:
    name: Full regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validator and mathematical regression suite
        shell: pwsh
        working-directory: Zepholume-Shaders
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/tests/validate-tests.ps1

      - name: Benchmark tooling regression suite
        shell: pwsh
        working-directory: Zepholume-Shaders
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/tests/benchmark-tests.ps1

      - name: Ensure tests did not modify tracked files
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet --exit-code; then
            git diff --check
            git diff
            echo "::error::Regression tests modified tracked repository files"
            exit 1
          fi

  windows-smoke:
    name: Windows PowerShell smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Validate source
        shell: pwsh
        working-directory: Zepholume-Shaders
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/validate.ps1

      - name: Run mathematical tests
        shell: pwsh
        working-directory: Zepholume-Shaders
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/tests/math-regression.ps1
          ./scripts/tests/water-specular-gating-equivalence.ps1

      - name: Run benchmark tooling tests
        shell: pwsh
        working-directory: Zepholume-Shaders
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/tests/benchmark-tests.ps1

  portability:
    name: Static portability matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Evaluate portability matrix
        shell: pwsh
        working-directory: Zepholume-Shaders
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'zepholume-portability'
          ./scripts/portability-matrix.ps1 -OutputRoot $output

          $manifest = Join-Path $output 'manifest.json'
          if (-not (Test-Path -LiteralPath $manifest)) { throw "Portability matrix did not produce manifest.json" }
          $rows = @(Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json)
          if ($rows.Count -lt 1) { throw "Portability matrix is empty" }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Static portability matrix"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Mocked cases validated: **$($rows.Count)**"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- This is static/preprocessor evidence, not real GPU runtime qualification."

  glsl-compiler:
    name: GLSL compiler validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install Khronos glslangValidator
        id: glslang
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools
          validator="$(command -v glslangValidator)"
          test -x "$validator"
          "$validator" --version
          echo "path=$validator" >> "$GITHUB_OUTPUT"

      - name: Generate evaluated shader variants
        shell: pwsh
        working-directory: Zepholume-Shaders
        env:
          GLSLANG_VALIDATOR: ${{ steps.glslang.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $variants = Join-Path $env:RUNNER_TEMP 'zepholume-variants'
          ./scripts/generate-compiled-variants.ps1 -OutputRoot $variants -Validator $env:GLSLANG_VALIDATOR

      - name: Compile every unique evaluated variant
        shell: pwsh
        working-directory: Zepholume-Shaders
        env:
          GLSLANG_VALIDATOR: ${{ steps.glslang.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $variants = Join-Path $env:RUNNER_TEMP 'zepholume-variants'
          $reports = Join-Path $env:RUNNER_TEMP 'zepholume-glslang'
          ./scripts/validate-glsl.ps1 -VariantRoot $variants -ReportRoot $reports -Validator $env:GLSLANG_VALIDATOR

          $markdown = Join-Path $reports 'glslang-report.md'
          if (-not (Test-Path -LiteralPath $markdown)) { throw "GLSL validation report was not produced" }
          Get-Content -LiteralPath $markdown | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload GLSL validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glslang-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/zepholume-glslang
          if-no-files-found: warn
          retention-days: 7

  package-validation:
    name: Deterministic package validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Build package twice and compare
        id: package
        shell: pwsh
        working-directory: Zepholume-Shaders
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path (Get-Location) 'dist'
          Remove-Item -LiteralPath $dist -Recurse -Force -ErrorAction SilentlyContinue

          ./scripts/package.ps1 -OutputName 'ci-build-a.zip'
          $first = Join-Path $dist 'ci-build-a.zip'
          $firstHash = (Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash

          ./scripts/package.ps1 -OutputName 'ci-build-b.zip'
          $second = Join-Path $dist 'ci-build-b.zip'
          $secondHash = (Get-FileHash -LiteralPath $second -Algorithm SHA256).Hash

          if ($firstHash -cne $secondHash) {
              throw "Package is not reproducible within the same runner: $firstHash != $secondHash"
          }

          $shaLine = (Get-Content -LiteralPath "$first.sha256" -Raw).Trim()
          $expected = "$firstHash  ci-build-a.zip"
          if ($shaLine -cne $expected) {
              throw "Checksum sidecar mismatch. Expected '$expected', found '$shaLine'"
          }

          $size = (Get-Item -LiteralPath $first).Length
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Deterministic package"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- SHA-256: $firstHash"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Size: **$size bytes**"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Two clean builds produced identical ZIP bytes."

          "zip=Zepholume-Shaders/dist/ci-build-a.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=Zepholume-Shaders/dist/ci-build-a.zip.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload validated package
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zepholume-ci-package-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          retention-days: 7

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - workflow-policy
      - regression-tests
      - windows-smoke
      - portability
      - glsl-compiler
      - package-validation
    steps:
      - name: Enforce required job results
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            [workflow-policy]="${{ needs.workflow-policy.result }}"
            [regression-tests]="${{ needs.regression-tests.result }}"
            [windows-smoke]="${{ needs.windows-smoke.result }}"
            [portability]="${{ needs.portability.result }}"
            [glsl-compiler]="${{ needs.glsl-compiler.result }}"
            [package-validation]="${{ needs.package-validation.result }}"
          )

          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            printf '%s: %s\n' "$job" "$result"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job finished with result '$result'"
              failed=1
            fi
          done
          exit "$failed"
